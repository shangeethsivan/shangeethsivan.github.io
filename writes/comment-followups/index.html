  <style>
    :root {
      --g-blue: #4285F4;
      --g-red: #EA4335;
      --g-yellow: #FBBC05;
      --g-green: #34A853;
      --bg: #ffffff;
      --text: #12141a;
      --muted: #5c6570;
      --font: "Outfit", system-ui, sans-serif;
      --wordmark: "Caveat", cursive;
      --radius: 16px;
      --max: min(420px, 100% - 2rem);
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.35;
      display: flex;
      flex-direction: column;
    }

    .glows {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glows span {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
    }

    .glows .g1 {
      width: 280px;
      height: 280px;
      background: var(--g-blue);
      top: -60px;
      left: -80px;
    }

    .glows .g2 {
      width: 240px;
      height: 240px;
      background: var(--g-red);
      top: 30%;
      right: -100px;
    }

    .glows .g3 {
      width: 220px;
      height: 220px;
      background: var(--g-yellow);
      bottom: 20%;
      left: -60px;
    }

    .glows .g4 {
      width: 260px;
      height: 260px;
      background: var(--g-green);
      bottom: -80px;
      right: -40px;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      width: var(--max);
      margin-inline: auto;
      padding: clamp(1.25rem, 5vw, 2rem) 0 clamp(1rem, 4vw, 1.5rem);
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 3.5vw, 1.5rem);
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.75rem, 8vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 1rem 1.125rem;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--card-border, var(--g-blue));
      border-radius: var(--radius);
      box-shadow: 0 4px 24px var(--card-glow, rgba(66, 133, 244, 0.12));
      text-decoration: none;
      color: inherit;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .card[data-n="1"] {
      --card-border: var(--g-blue);
      --card-glow: rgba(66, 133, 244, 0.14);
    }

    .card[data-n="2"] {
      --card-border: var(--g-red);
      --card-glow: rgba(234, 67, 53, 0.14);
    }

    .card[data-n="3"] {
      --card-border: var(--g-green);
      --card-glow: rgba(52, 168, 83, 0.14);
    }

    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px var(--card-glow);
    }

    a.card:focus-visible {
      outline: 2px solid var(--card-border);
      outline-offset: 3px;
    }

    .card-num {
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--card-border);
      background: color-mix(in srgb, var(--card-border) 10%, white);
      border-radius: 10px;
    }

    .card-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--card-border);
    }

    .card-text {
      margin: 0;
      font-size: clamp(1.05rem, 4.2vw, 1.2rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .card-arrow {
      flex-shrink: 0;
      width: 1.5rem;
      height: 1.5rem;
      color: var(--card-border);
      opacity: 0.85;
    }

    a.card:hover .card-arrow,
    a.card:focus-visible .card-arrow {
      opacity: 1;
      transform: translateX(2px);
      transition: transform 160ms ease, opacity 160ms ease;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 1rem 1.25rem;
    }

    .wordmark {
      display: inline-block;
      font-family: var(--wordmark);
      font-size: clamp(1.75rem, 7vw, 2.25rem);
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      padding-bottom: 0.35rem;
      background: linear-gradient(
        90deg,
        var(--g-blue) 0%,
        var(--g-blue) 25%,
        var(--g-red) 25%,
        var(--g-red) 50%,
        var(--g-yellow) 50%,
        var(--g-yellow) 75%,
        var(--g-green) 75%,
        var(--g-green) 100%
      ) bottom / 100% 4px no-repeat;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 0.625rem;
    }

    .social a {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
    }

    .social a:hover,
    .social a:focus-visible {
      color: var(--g-blue);
    }

    .social a:focus-visible {
      outline: 2px solid var(--g-blue);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .accent-bar {
      position: relative;
      z-index: 1;
      height: 5px;
      display: flex;
      flex-shrink: 0;
    }

    .accent-bar span {
      flex: 1;
    }

    .accent-bar .b { background: var(--g-blue); }
    .accent-bar .r { background: var(--g-red); }
    .accent-bar .y { background: var(--g-yellow); }
    .accent-bar .g { background: var(--g-green); }

    @media (min-width: 640px) {
      :root { --max: min(480px, 100% - 3rem); }
      main { gap: 1.75rem; }
      .cards { gap: 1rem; }
      .card { padding: 1.125rem 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card-arrow { transition: none; }
    }
