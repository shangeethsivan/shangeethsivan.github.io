  function parseHash() {

    var params = {};
    var parts = raw.split('&');
    var valid = true;

    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (kv.length !== 2) { valid = false; continue; }
      if (!Object.prototype.hasOwnProperty.call(HASH_KEYS, kv[0])) { valid = false; continue; }
      params[kv[0]] = kv[1];

      return { surface: null, email: null, numberOwner: null, valid: false };

    var answers = { surface: null, email: null, numberOwner: null };

      if (!Object.prototype.hasOwnProperty.call(HASH_KEYS, key)) continue;
      var field = HASH_KEYS[key];
      if (!(key in params)) continue;
      var val = params[key];
      var bucket = field === 'surface' ? VALID.surface : field === 'email' ? VALID.email : VALID.numberOwner;
      if (bucket[val]) {
        answers[field] = val;
      } else {
        return { surface: null, email: null, numberOwner: null, valid: false };
      }
    }

    return answers;

  }

  function copyAnswers(a) {
    return { surface: a.surface, email: a.email, numberOwner: a.numberOwner };
  }

  function historyPayload(view, answers) {
    return { view: view, answers: copyAnswers(answers) };
  }

  function syncHistory(view, usePush) {
    var hash = buildHash(state.answers);
    var url = location.pathname + location.search + hash;
    var payload = historyPayload(view, state.answers);
    if (usePush) {
      history.pushState(payload, '', url);
    } else {
      history.replaceState(payload, '', url);
    }
  }

  function applyHistoryState(st) {
    if (st && st.answers) {
      state.answers = copyAnswers(st.answers);
      state.view = st.view === 'path' ? 'path' : 'chooser';
      return true;
    }
    return false;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── SVG illustrations ── */
  function phoneFrame(inner, chip) {
    return '<svg viewBox="0 0 200 280" role="img" aria-label="' + esc(chip) + ' — illustrated, not an official screenshot">' +
      '<rect x="40" y="8" width="120" height="264" rx="18" fill="#0a1020" stroke="rgba(148,163,184,0.35)" stroke-width="2"/>' +
      '<rect x="78" y="16" width="44" height="6" rx="3" fill="rgba(148,163,184,0.25)"/>' +
      inner +
      '<rect x="70" y="258" width="60" height="4" rx="2" fill="rgba(148,163,184,0.2)"/>' +
      '</svg>';
  }

  function browserFrame(urlBar, inner, chip) {
    return '<svg viewBox="0 0 240 200" role="img" aria-label="' + esc(chip) + ' — illustrated, not an official screenshot">' +
      '<rect x="8" y="8" width="224" height="184" rx="10" fill="#0a1020" stroke="rgba(148,163,184,0.35)" stroke-width="2"/>' +
      '<rect x="8" y="8" width="224" height="28" rx="10" fill="#121a2e"/>' +
      '<circle cx="24" cy="22" r="4" fill="#ff6b6b"/><circle cx="38" cy="22" r="4" fill="#ffd166"/><circle cx="52" cy="22" r="4" fill="#6df0b4"/>' +
      '<rect x="64" y="14" width="150" height="16" rx="4" fill="#070b14"/>' +
      '<text x="72" y="26" fill="#9fb0cc" font-size="8" font-family="Outfit,sans-serif">' + esc(urlBar) + '</text>' +
      inner +
      '</svg>';
  }

  function renderFrame(frameId, caption) {
    var inner = '';
    switch (frameId) {
      case 'A-login':
        inner = '<rect x="52" y="48" width="96" height="14" rx="4" fill="#151d33"/>' +
          '<rect x="52" y="72" width="96" height="14" rx="4" fill="#151d33"/>' +
          '<rect x="52" y="100" width="96" height="28" rx="6" fill="#76c7ff"/>' +
          '<text x="100" y="118" text-anchor="middle" fill="#041122" font-size="9" font-weight="700" font-family="Outfit,sans-serif">OTP</text>' +
          '<text x="100" y="150" text-anchor="middle" fill="#9fb0cc" font-size="7" font-family="Outfit,sans-serif">' + esc(caption.slice(0, 28)) + '</text>';
        return phoneFrame(inner, caption);
      case 'A-home':
        inner = '<rect x="52" y="44" width="96" height="36" rx="6" fill="#1a2544" stroke="#76c7ff" stroke-width="1"/>' +
          '<text x="100" y="58" text-anchor="middle" fill="#76c7ff" font-size="7" font-weight="700" font-family="Outfit,sans-serif">Google AI Pro</text>' +
          '<text x="100" y="72" text-anchor="middle" fill="#9fb0cc" font-size="6" font-family="Outfit,sans-serif">Gemini offer</text>' +
          '<rect x="52" y="90" width="96" height="10" rx="3" fill="#151d33"/><rect x="52" y="108" width="72" height="10" rx="3" fill="#151d33"/>';
        return phoneFrame(inner, caption);
      case 'A-claim':
        inner = '<rect x="52" y="60" width="96" height="40" rx="6" fill="#1a2544"/>' +
          '<rect x="62" y="120" width="76" height="24" rx="8" fill="linear-gradient" style="fill:#76c7ff"/>' +
          '<text x="100" y="136" text-anchor="middle" fill="#041122" font-size="8" font-weight="700" font-family="Outfit,sans-serif">Claim offer</text>';
        return phoneFrame(inner, caption);
      case 'A-google':
        inner = '<rect x="52" y="50" width="96" height="22" rx="5" fill="#151d33" stroke="#76c7ff" stroke-width="1"/>' +
          '<text x="100" y="64" text-anchor="middle" fill="#edf3ff" font-size="7" font-family="Outfit,sans-serif">Saved account</text>' +
          '<rect x="52" y="82" width="96" height="22" rx="5" fill="#151d33"/>' +
          '<text x="100" y="96" text-anchor="middle" fill="#b19dff" font-size="7" font-family="Outfit,sans-serif">Use another account</text>';
        return phoneFrame(inner, caption);
      case 'A-done':
        inner = '<circle cx="100" cy="110" r="28" fill="rgba(109,240,180,0.15)" stroke="#6df0b4" stroke-width="2"/>' +
          '<path d="M88 110 L96 118 L114 98" fill="none" stroke="#6df0b4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
        return phoneFrame(inner, caption);
      case 'W-offer':
        inner = '<rect x="20" y="48" width="200" height="120" rx="6" fill="#0f1526"/>' +
          '<text x="120" y="78" text-anchor="middle" fill="#76c7ff" font-size="10" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">Google AI Pro</text>' +
          '<text x="120" y="96" text-anchor="middle" fill="#9fb0cc" font-size="8" font-family="Outfit,sans-serif">Jio offer page</text>';
        return browserFrame('jio.com/google-gemini-offer', inner, caption);
      case 'W-claim':
        inner = '<rect x="20" y="48" width="200" height="100" rx="6" fill="#0f1526"/>' +
          '<rect x="70" y="100" width="100" height="28" rx="8" fill="#76c7ff"/>' +
          '<text x="120" y="118" text-anchor="middle" fill="#041122" font-size="9" font-weight="700" font-family="Outfit,sans-serif">Claim offer</text>';
        return browserFrame('jio.com/google-gemini-offer', inner, caption);
      case 'W-handoff':
        inner = '<rect x="20" y="44" width="130" height="90" rx="6" fill="#0f1526"/>' +
          '<rect x="130" y="70" width="60" height="100" rx="10" fill="#0a1020" stroke="rgba(148,163,184,0.35)"/>' +
          '<text x="150" y="110" text-anchor="middle" fill="#76c7ff" font-size="6" font-family="Outfit,sans-serif">MyJio</text>' +
          '<path d="M150 44 L150 70" stroke="#b19dff" stroke-width="2" marker-end="url(#arr)"/>' +
          '<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b19dff"/></marker></defs>' +
          '<text x="85" y="130" text-anchor="middle" fill="#9fb0cc" font-size="7" font-family="Outfit,sans-serif">Opens MyJio</text>';
        return browserFrame('jio.com/dl/dashboard', inner, caption);
      case 'W-google':
        inner = '<rect x="30" y="52" width="180" height="28" rx="5" fill="#151d33" stroke="#76c7ff"/>' +
          '<text x="120" y="70" text-anchor="middle" fill="#edf3ff" font-size="8" font-family="Outfit,sans-serif">Google sign-in</text>' +
          '<rect x="30" y="90" width="180" height="22" rx="5" fill="#151d33"/>' +
          '<text x="120" y="104" text-anchor="middle" fill="#b19dff" font-size="7" font-family="Outfit,sans-serif">Use another account</text>';
        return browserFrame('accounts.google.com', inner, caption);
      case 'W-done':
        inner = '<rect x="20" y="48" width="200" height="110" rx="6" fill="#0f1526"/>' +
          '<text x="120" y="82" text-anchor="middle" fill="#edf3ff" font-size="9" font-family="Outfit,sans-serif">gemini.google.com</text>' +
          '<rect x="80" y="92" width="80" height="20" rx="6" fill="rgba(118,199,255,0.2)" stroke="#76c7ff"/>' +
          '<text x="120" y="106" text-anchor="middle" fill="#76c7ff" font-size="8" font-weight="700" font-family="Outfit,sans-serif">AI Pro</text>';
        return browserFrame('gemini.google.com', inner, caption);
      default:
        return phoneFrame('<text x="100" y="120" text-anchor="middle" fill="#9fb0cc" font-size="8">Step</text>', caption);
    }
  }

  /* ── UI render ── */
  var chooserPanel = document.getElementById('chooser-panel');
  var pathPanel = document.getElementById('path-panel');
  var chooserRoot = document.getElementById('chooser-root');
  var pathRoot = document.getElementById('path-root');

  var QUESTIONS = [
    {
      field: 'surface',
      legend: 'Where are you setting this up?',
      options: [
        { value: 'app', label: 'Phone — MyJio app', help: null },
        { value: 'web', label: 'Computer — Jio website', help: 'Starts on Jio\u2019s public offer page. Claiming still finishes in MyJio (usually on a phone) and a Google sign-in. There is no separate MyJio desktop console.' }
      ]
    },
    {
      field: 'email',
      legend: 'Which Google account should get AI Pro?',
      options: [
        { value: 'sim', label: 'Email already on this Jio number', help: null },
        { value: 'custom', label: 'Different or custom email', help: 'That address must already be a Google Account, or you create one first. Jio\u2019s screens say Gmail ID. If they refuse a non-Gmail address, use Gmail.' }
      ]
    },
    {
      field: 'numberOwner',
      legend: 'Whose Jio number is eligible?',
      options: [
        { value: 'self', label: 'My number', help: null },
        { value: 'family', label: 'Family member\u2019s number', help: 'Log into MyJio with the eligible number, then sign into <strong>your</strong> Google account. Jio has no extra \u201cfamily link\u201d product for this offer. You need that number\u2019s OTP (ask them).' }
      ]
    }
  ];

  function isComplete(a) {
    return !!(a.surface && a.email && a.numberOwner);
  }

  function mountChooser() {
    var html = '';

    for (var qi = 0; qi < QUESTIONS.length; qi++) {
      var q = QUESTIONS[qi];
      html += '<fieldset class="chooser-fieldset" role="radiogroup" aria-labelledby="q-' + q.field + '">';
      html += '<legend id="q-' + q.field + '">' + esc(q.legend) + '</legend>';

      for (var oi = 0; oi < q.options.length; oi++) {
        var opt = q.options[oi];
        var id = q.field + '-' + opt.value;
        html += '<label class="option" for="' + id + '">';
        html += '<input type="radio" name="' + q.field + '" id="' + id + '" value="' + opt.value + '" />';
        html += '<span><span class="option-label">' + esc(opt.label) + '</span>';
        if (opt.help) {
          html += '<div class="option-help">' + opt.help + '</div>';
        }
        html += '</span></label>';
      }
      html += '</fieldset>';
    }

    html += '<div class="chooser-actions">';
    html += '<button type="button" class="btn primary" id="continue-btn" disabled aria-label="Continue. Answer all three questions first">Continue</button>';
    html += '<span class="gate-hint" id="gate-hint">Answer all three</span>';
    html += '</div>';

    chooserRoot.innerHTML = html;

    chooserRoot.addEventListener('change', function (ev) {
      if (ev.target.type === 'radio') onRadioChange(ev);
    });

    document.getElementById('continue-btn').addEventListener('click', onContinue);
    chooserMounted = true;
  }

  function syncChooserUI() {
    if (!chooserMounted) mountChooser();

    var a = state.answers;
    for (var qi = 0; qi < QUESTIONS.length; qi++) {
      var field = QUESTIONS[qi].field;
      var radios = chooserRoot.querySelectorAll('input[name="' + field + '"]');
      for (var ri = 0; ri < radios.length; ri++) {
        radios[ri].checked = radios[ri].value === a[field];
      }
    }

    var complete = isComplete(a);
    var continueBtn = document.getElementById('continue-btn');
    var gateHint = document.getElementById('gate-hint');
    continueBtn.disabled = !complete;
    if (complete) {
      continueBtn.removeAttribute('aria-label');
    } else {
      continueBtn.setAttribute('aria-label', 'Continue. Answer all three questions first');
    }
    gateHint.hidden = complete;
  }

  function renderPath(pathId) {
    var content = PATH_CONTENT[pathId];
    if (!content) return;

    var html = '<h2 class="path-headline">' + content.headline + '</h2>';
    if (content.subheadline) {
      html += '<p class="path-subhead">' + content.subheadline + '</p>';
    }

    html += '<div class="steps">';
    for (var si = 0; si < content.steps.length; si++) {
      var step = content.steps[si];
      html += '<article class="step-card">';
      html += '<div class="step-illus">' + renderFrame(step.frameId, step.caption);
      html += '<div class="illus-disclaimer">Illustrated — not an official screenshot.</div></div>';
      html += '<div class="step-copy">';
      html += '<div class="step-num">Step ' + step.n + '</div>';
      html += '<h3 class="step-title">' + esc(step.title) + '</h3>';
      html += '<p class="step-body">' + step.body + '</p>';

      if (!content.isApp && step.n === 3) {
        html += '<aside class="callout" aria-label="Desktop claim handoff">';
        html += '<p>Official Claim offer opens MyJio (<code>jio.com/dl/dashboard</code>), not a desktop MyJio console. Switch to the phone steps if that is all you get.</p>';
        html += '<button type="button" class="btn primary" id="phone-steps-btn">Show the phone steps</button>';
        html += '</aside>';
      }

      html += '</div></article>';
    }
    html += '</div>';

    html += '<div class="path-actions">';
    html += '<button type="button" class="btn" id="change-answers-btn">Change answers</button>';
    html += '</div>';

    html += '<footer class="footnotes"><ul>';
    for (var fi = 0; fi < SHARED_FOOTNOTES.length; fi++) {
      html += '<li>' + esc(SHARED_FOOTNOTES[fi]) + '</li>';
    }
    if (content.isApp) {
      html += '<li>' + esc(APP_BANNER_FOOTNOTE) + '</li>';
    }
    html += '<li>You need a network connection to claim on Jio/Google.</li>';
    html += '</ul></footer>';

    pathRoot.innerHTML = html;

    document.getElementById('change-answers-btn').addEventListener('click', function () {
      state.view = 'chooser';
      syncHistory('chooser', false);
      updateView();
    });

    var phoneBtn = document.getElementById('phone-steps-btn');
    if (phoneBtn) {
      phoneBtn.addEventListener('click', function () {
        state.answers.surface = 'app';
        state.view = 'path';
        syncHistory('path', true);
        updateView();
      });
    }
  }

  function updateView() {
    var pathId = derivePathId(state.answers);

    if (state.view === 'path' && pathId && PATH_CONTENT[pathId]) {
      chooserPanel.hidden = true;
      pathPanel.hidden = false;
      renderPath(pathId);
    } else {
      state.view = 'chooser';
      chooserPanel.hidden = false;
      pathPanel.hidden = true;
      syncChooserUI();
    }
  }

  function onRadioChange(ev) {
    state.answers[ev.target.name] = ev.target.value;
    syncHistory('chooser', false);
    syncChooserUI();
  }

  function onContinue() {
    if (!isComplete(state.answers)) return;
    state.view = 'path';
    syncHistory('path', true);
    updateView();
  }

  function restoreFromHash() {
    var parsed = parseHash();
    if (parsed.valid === false) {
      state.answers = { surface: null, email: null, numberOwner: null };
      state.view = 'chooser';
      history.replaceState(historyPayload('chooser', state.answers), '', location.pathname + location.search);
      return;
    }
    state.answers = {
      surface: parsed.surface || null,
      email: parsed.email || null,
      numberOwner: parsed.numberOwner || null
    };
    state.view = isComplete(state.answers) ? 'path' : 'chooser';
  }

  function boot() {
    if (!applyHistoryState(history.state)) {
      restoreFromHash();
    }

    syncHistory(state.view, false);
    updateView();
  }

  window.addEventListener('hashchange', function () {
    if (applyHistoryState(history.state)) {
      updateView();
      return;
    }
    restoreFromHash();
    syncHistory(state.view, false);
    updateView();
  });

  window.addEventListener('popstate', function (event) {
    if (applyHistoryState(event.state)) {
      updateView();
      return;
    }
    restoreFromHash();
    updateView();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
