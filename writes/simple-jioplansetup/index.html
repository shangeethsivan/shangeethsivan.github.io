      --well: #f6f7f9;

      --line: #e8eaee;

      --muted: #5c6570;
      --accent: #0b6bcb;
      --accent-hover: #0958a8;
      --warn: #b45309;
      --font: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 12px;
      --max: min(720px, 100% - 1.5rem);
      --max-wide: min(960px, 100% - 1.5rem);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      width: var(--max);
      margin-inline: auto;
      padding: 1.25rem 0 2.5rem;
    }

    .wrap.wide { width: var(--max-wide); }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.85rem;
    }

    .brand {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none;
    }

    .brand:hover { color: var(--accent); }

    .back {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
    }

    .back:hover {
      border-color: var(--accent);
      background: var(--well);
    }

    .back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-weight: 700;
    }

    .hub-lead {
      margin: 0.65rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .eligibility {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: var(--well);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .eligibility a { color: var(--accent); }

    .view[hidden] { display: none !important; }

    /* Hub cards */
    .hub-cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .hub-card {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      min-height: 72px;
      cursor: pointer;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .hub-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(11, 107, 203, 0.08);
    }

    .hub-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hub-card-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--well);
      border-radius: 10px;
      color: var(--accent);
    }

    .hub-card-icon svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    .hub-card-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin: 0;
    }

    .hub-card-help {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* Jio chooser */
    .jio-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .jio-option {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      width: 100%;
      padding: 1rem 1.1rem;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      cursor: pointer;
      min-height: 72px;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .jio-option:hover {
      border-color: var(--accent);
      background: var(--well);
    }

    .jio-option[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(11, 107, 203, 0.06);
    }

    .jio-option:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .jio-option-label {
      font-weight: 700;
      font-size: 1.05rem;
      display: block;
    }

    .jio-option-help {
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .path-headline {
      font-size: clamp(1.15rem, 3vw, 1.4rem);
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 0.5rem;
    }

    .path-subhead {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1rem;
    }

    .steps {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .step-card {
      display: grid;
      gap: 0.85rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--card);
    }

    @media (min-width: 640px) {
      .step-card {
        grid-template-columns: minmax(0, 200px) minmax(0, 1fr);
        align-items: start;
      }
    }

    .step-illus {
      width: 100%;
      max-width: 200px;
      margin-inline: auto;
    }

    .step-illus svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .illus-disclaimer {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.35rem;
    }

    .step-num {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .step-title {
      margin: 0.2rem 0 0.35rem;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .step-body {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--well);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .callout p { margin: 0; }

    .callout a { color: var(--accent); }

    .footnotes {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .footnotes ul {
      margin: 0;
      padding-left: 1.1rem;
    }

    .path-actions {
      margin-top: 1rem;
    }

    .text-btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line);
      color: var(--accent);
      background: var(--card);
      cursor: pointer;
      min-height: 44px;

      background: var(--well);
    }

      outline: 2px solid var(--accent);
      outline-offset: 2px;

    .compare-caption {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .compare-table-wrap {
      margin-top: 1.25rem;
      overflow-x: auto;

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .compare-table caption {
      caption-side: top;
      text-align: left;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .compare-table th,
    .compare-table td {
      border: 1px solid var(--line);
      padding: 0.75rem 0.85rem;
      text-align: left;
      vertical-align: top;

    .compare-table th {

      font-weight: 700;

      margin-right: 0.25rem;

    .compare-cards {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .compare-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--card);

    .compare-card h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;

    .compare-metric {
      margin-bottom: 0.65rem;
    }

    .compare-metric:last-child { margin-bottom: 0; }

    .compare-metric-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .compare-metric-value {
      font-size: 0.95rem;
      line-height: 1.45;
    }

      padding: 0.85rem 1rem;

      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--well);

      font-size: 1.1rem;
      margin: 0 0 0.75rem;

      border: 1px solid var(--line);
      padding: 0.5rem;
      text-align: left;
    }

      .jio-option { transition: none; }
    }

  var COMPARE_FOOTER = 'Unofficial comparison for everyday use. Prices and limits change. Confirm on <a href="' + LINKS.googlePlans + '" target="_blank" rel="noopener noreferrer">Google AI plans</a>, <a href="' + LINKS.openaiPlans + '" target="_blank" rel="noopener noreferrer">ChatGPT pricing</a>, and <a href="' + LINKS.claudePlans + '" target="_blank" rel="noopener noreferrer">Claude</a>. Not affiliated with those companies or Jio.';

  var HUB_CARDS = [
    { id: 'jio', title: 'Jio Setup Help', help: 'Basic or Custom Email \u00B7 5 steps', icon: 'ico-jio', route: { view: 'jio-chooser', email: null } },
    { id: 'compare', title: 'Compare Google AI Pro / Claude / ChatGPT', help: 'Simple AI usage comparison', icon: 'ico-compare', route: { view: 'compare', email: null } },
    { id: 'video', title: 'How I built a friend\u2019s website', help: 'YouTube \u00B7 starts at 7:10', icon: 'ico-video', href: LINKS.friendVideo }
  ];

  var JIO_OPTIONS = [
    { email: 'basic', label: 'Basic', help: 'Email already on this Jio number' },
    { email: 'custom', label: 'Custom Email', help: 'A different Google Account (custom mail must already be Google)' }
  ];

  var VALID_EMAIL = { basic: true, custom: true };
  var VALID_VIEW = { hub: true, 'jio-chooser': true, 'jio-path': true, compare: true };

  var route = { view: 'hub', email: null };

  var mainWrap = document.getElementById('main-wrap');
  var backSlot = document.getElementById('back-slot');
  var eligibilitySlot = document.getElementById('eligibility-slot');
  var views = {
    hub: document.getElementById('view-hub'),
    'jio-chooser': document.getElementById('view-jio-chooser'),
    'jio-path': document.getElementById('view-jio-path'),
    compare: document.getElementById('view-compare')
  };
  var hubCardsRoot = document.getElementById('hub-cards');
  var jioOptionsRoot = document.getElementById('jio-options');
  var pathRoot = document.getElementById('path-root');
  var compareRoot = document.getElementById('compare-root');

  var hubMounted = false;
  var jioMounted = false;
  var compareMounted = false;

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function copyRoute(r) {
    return { view: r.view, email: r.email };
  }

  function derivePathId(email) {
    return email;
  }

  function parseRouteFromHash() {
    var raw = location.hash.replace(/^#/, '');
    if (!raw) return { view: 'hub', email: null };

    var params = {};
    var parts = raw.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (kv.length === 2) params[kv[0]] = decodeURIComponent(kv[1]);
    }

    if (params.v) {
      if (params.v === 'hub') return { view: 'hub', email: null };
      if (params.v === 'jio') {
        if (params.e && VALID_EMAIL[params.e]) return { view: 'jio-path', email: params.e };
        return { view: 'jio-chooser', email: null };
      }
      if (params.v === 'compare') return { view: 'compare', email: null };
      return { view: 'hub', email: null };
    }

    if ('e' in params) {
      var mapped = params.e === 'sim' ? 'basic' : params.e === 'custom' ? 'custom' : null;
      if (mapped && VALID_EMAIL[mapped]) return { view: 'jio-path', email: mapped };
      return { view: 'hub', email: null };
    }

    return { view: 'hub', email: null };
  }

  function buildHash(r) {
    if (r.view === 'hub') return '';
    if (r.view === 'jio-chooser') return '#v=jio';
    if (r.view === 'jio-path' && r.email) return '#v=jio&e=' + r.email;
    if (r.view === 'compare') return '#v=compare';
    return '';
  }

  function historyPayload(r) {
    return { view: r.view, email: r.email };
  }

  function writeRoute(r, usePush) {
    var hash = buildHash(r);
    var url = location.pathname + location.search + hash;
    var payload = historyPayload(r);
    if (usePush) history.pushState(payload, '', url);
    else history.replaceState(payload, '', url);
  }

  function applyHistoryState(st) {
    if (st && st.view && VALID_VIEW[st.view]) {
      route = { view: st.view, email: st.email || null };
      if (route.view === 'jio-path' && !route.email) route.view = 'jio-chooser';
      return true;
    }
    return false;
  }

  function iconSvg(id) {
    if (id === 'ico-jio') {
      return '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="4" width="14" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="7" width="6" height="2" rx="1" fill="currentColor" opacity="0.4"/><rect x="11" y="12" width="10" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M13 18 L15.5 20.5 L19 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    if (id === 'ico-compare') {
      return '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="18" width="5" height="10" rx="1" fill="currentColor" opacity="0.35"/><rect x="13.5" y="12" width="5" height="16" rx="1" fill="currentColor" opacity="0.6"/><rect x="21" y="6" width="5" height="22" rx="1" fill="currentColor"/></svg>';
    }
    if (id === 'ico-video') {
      return '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="8" width="24" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 12 L22 16 L14 20 Z" fill="currentColor"/></svg>';
    }
    return '';
  }

  function phoneFrame(inner, chip) {
    return '<svg viewBox="0 0 200 280" role="img" aria-label="' + esc(chip) + ' — illustrated, not an official screenshot">' +
      '<rect x="40" y="8" width="120" height="264" rx="18" fill="#ffffff" stroke="#e8eaee" stroke-width="2"/>' +
      '<rect x="78" y="16" width="44" height="6" rx="3" fill="#e8eaee"/>' +
      inner +
      '<rect x="70" y="258" width="60" height="4" rx="2" fill="#e8eaee"/>' +
      '</svg>';
  }

  function renderFrame(frameId, caption) {
    var inner = '';
    switch (frameId) {
      case 'A-login':
        inner = '<rect x="52" y="48" width="96" height="14" rx="4" fill="#f6f7f9" stroke="#e8eaee"/>' +
          '<rect x="52" y="72" width="96" height="14" rx="4" fill="#f6f7f9" stroke="#e8eaee"/>' +
          '<rect x="52" y="100" width="96" height="28" rx="6" fill="#0b6bcb"/>' +
          '<text x="100" y="118" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">OTP</text>';
        return phoneFrame(inner, caption);
      case 'A-home':
        inner = '<rect x="52" y="44" width="96" height="36" rx="6" fill="#f6f7f9" stroke="#0b6bcb" stroke-width="1.5"/>' +
          '<text x="100" y="58" text-anchor="middle" fill="#0b6bcb" font-size="7" font-weight="700" font-family="system-ui,sans-serif">Google AI Pro</text>' +
          '<text x="100" y="72" text-anchor="middle" fill="#5c6570" font-size="6" font-family="system-ui,sans-serif">Gemini offer</text>' +
          '<rect x="52" y="90" width="96" height="10" rx="3" fill="#f6f7f9"/><rect x="52" y="108" width="72" height="10" rx="3" fill="#f6f7f9"/>';
        return phoneFrame(inner, caption);
      case 'A-claim':
        inner = '<rect x="52" y="60" width="96" height="40" rx="6" fill="#f6f7f9"/>' +
          '<rect x="62" y="120" width="76" height="24" rx="8" fill="#0b6bcb"/>' +
          '<text x="100" y="136" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="700" font-family="system-ui,sans-serif">Claim offer</text>';
        return phoneFrame(inner, caption);
      case 'A-google':
        inner = '<rect x="52" y="50" width="96" height="22" rx="5" fill="#f6f7f9" stroke="#0b6bcb" stroke-width="1"/>' +
          '<text x="100" y="64" text-anchor="middle" fill="#12141a" font-size="7" font-family="system-ui,sans-serif">Saved account</text>' +
          '<rect x="52" y="82" width="96" height="22" rx="5" fill="#f6f7f9"/>' +
          '<text x="100" y="96" text-anchor="middle" fill="#0b6bcb" font-size="7" font-family="system-ui,sans-serif">Use another account</text>';
        return phoneFrame(inner, caption);
      case 'A-done':
        inner = '<circle cx="100" cy="110" r="28" fill="rgba(11,107,203,0.1)" stroke="#0b6bcb" stroke-width="2"/>' +
          '<path d="M88 110 L96 118 L114 98" fill="none" stroke="#0b6bcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
        return phoneFrame(inner, caption);
      default:
        return phoneFrame('<text x="100" y="120" text-anchor="middle" fill="#5c6570" font-size="8">Step</text>', caption);
    }
  }

  function formatCell(cell) {
    var html = '';
    if (cell.marker && MARKER_SYMBOL[cell.marker]) {
      html += '<span class="marker" aria-label="' + esc(MARKER_LABEL[cell.marker]) + '">' + MARKER_SYMBOL[cell.marker] + '</span>';
    }
    html += esc(cell.text).replace(/\*\(([^)]+)\)\*/g, '($1)').replace(/\*/g, '');
    return html;
  }

  function renderEligibility() {
    eligibilitySlot.innerHTML = '<p class="eligibility">' +
      '18+, unlimited 5G plan \u20B9349+ (prepaid or postpaid mobile), Jio retail only, once per unique mobile number. ' +
      'Keep the eligible plan active for the offer duration. ' +
      '<a href="' + LINKS.offer + '" target="_blank" rel="noopener noreferrer">Official Jio offer</a>' +
      '</p>';
  }

  function clearEligibility() {
    eligibilitySlot.innerHTML = '';
  }

  function renderBack() {
    if (route.view === 'hub') {
      backSlot.innerHTML = '';
      return;
    }
    var label = route.view === 'jio-path' ? 'Change email type' : 'Back to hub';
    backSlot.innerHTML = '<button type="button" class="back" id="back-btn">' + esc(label) + '</button>';
    document.getElementById('back-btn').addEventListener('click', onBack);
  }

  function onBack() {
    if (route.view === 'jio-path') {
      route = { view: 'jio-chooser', email: route.email };
      writeRoute(route, false);
    } else {
      route = { view: 'hub', email: null };
      writeRoute(route, false);
    }
    updateView();
  }

  function navigateTo(r, usePush) {
    route = copyRoute(r);
    writeRoute(route, usePush);
    updateView();
  }

  function mountHub() {
    if (hubMounted) return;
    var html = '';
    for (var i = 0; i < HUB_CARDS.length; i++) {
      var card = HUB_CARDS[i];
      if (card.href) {
        html += '<a class="hub-card" href="' + esc(card.href) + '" target="_blank" rel="noopener noreferrer">';
      } else {
        html += '<a class="hub-card" href="#" data-hub="' + esc(card.id) + '">';
      }
      html += '<span class="hub-card-icon">' + iconSvg(card.icon) + '</span>';
      html += '<span><span class="hub-card-title">' + esc(card.title) + '</span>';
      html += '<span class="hub-card-help">' + esc(card.help) + '</span></span>';
      html += '</a>';
    }
    hubCardsRoot.innerHTML = html;

    hubCardsRoot.addEventListener('click', function (ev) {
      var link = ev.target.closest('[data-hub]');
      if (!link) return;
      ev.preventDefault();
      var id = link.getAttribute('data-hub');
      for (var j = 0; j < HUB_CARDS.length; j++) {
        if (HUB_CARDS[j].id === id && HUB_CARDS[j].route) {
          navigateTo(HUB_CARDS[j].route, true);
          return;
        }
      }
    });

    hubMounted = true;
  }

  function mountJioChooser() {
    if (jioMounted) return;
    var html = '';
    for (var i = 0; i < JIO_OPTIONS.length; i++) {
      var opt = JIO_OPTIONS[i];
      html += '<button type="button" class="jio-option" data-email="' + opt.email + '" aria-pressed="false">';
      html += '<span><span class="jio-option-label">' + esc(opt.label) + '</span>';
      html += '<span class="jio-option-help">' + esc(opt.help) + '</span></span>';
      html += '</button>';
    }
    jioOptionsRoot.innerHTML = html;

    jioOptionsRoot.addEventListener('click', function (ev) {
      var btn = ev.target.closest('.jio-option');
      if (!btn) return;
      var email = btn.getAttribute('data-email');
      navigateTo({ view: 'jio-path', email: email }, true);
    });

    jioMounted = true;
  }

  function syncJioChooser() {
    mountJioChooser();
    var buttons = jioOptionsRoot.querySelectorAll('.jio-option');
    for (var i = 0; i < buttons.length; i++) {
      var email = buttons[i].getAttribute('data-email');
      buttons[i].setAttribute('aria-pressed', email === route.email ? 'true' : 'false');
    }
  }

  function renderCallout(type) {
    if (type === 'computer') return '<aside class="callout" aria-label="Computer setup note"><p>' + CALLOUT_COMPUTER + '</p></aside>';
    if (type === 'family') return '<aside class="callout" aria-label="Family SIM note"><p>' + CALLOUT_FAMILY + '</p></aside>';
    if (type === 'custom') return '<aside class="callout" aria-label="Custom email note"><p>' + esc(CALLOUT_CUSTOM) + '</p></aside>';
    return '';
  }

  function renderPath() {
    var pathId = derivePathId(route.email);
    var content = PATH_CONTENT[pathId];
    if (!content) {
      route = { view: 'jio-chooser', email: null };
      updateView();
      return;
    }

    var html = '<h2 class="path-headline">' + content.headline + '</h2>';
    if (content.subheadline) {
      html += '<p class="path-subhead">' + content.subheadline + '</p>';
    }

    html += '<div class="steps">';
    for (var si = 0; si < content.steps.length; si++) {
      var step = content.steps[si];
      html += '<article class="step-card">';
      html += '<div class="step-illus">' + renderFrame(step.frameId, step.caption);
      html += '<div class="illus-disclaimer">Illustrated — not an official screenshot.</div></div>';
      html += '<div class="step-copy">';
      html += '<div class="step-num">Step ' + step.n + '</div>';
      html += '<h3 class="step-title">' + esc(step.title) + '</h3>';
      html += '<p class="step-body">' + step.body + '</p>';
      html += '</div></article>';
    }
    html += '</div>';

    for (var ci = 0; ci < content.callouts.length; ci++) {
      html += renderCallout(content.callouts[ci]);
    }

    html += '<div class="path-actions">';
    html += '<button type="button" class="text-btn" id="change-email-btn">Change email type</button>';
    html += '</div>';

    html += '<footer class="footnotes"><ul>';
    for (var fi = 0; fi < SHARED_FOOTNOTES.length; fi++) {
      html += '<li>' + esc(SHARED_FOOTNOTES[fi]) + '</li>';
    }
    for (var fn = 0; fn < content.footnotes.length; fn++) {
      html += '<li>' + esc(content.footnotes[fn]) + '</li>';
    }
    html += '<li>You need a network connection to open Jio, Google, or YouTube.</li>';
    html += '<li>Get MyJio: <a href="' + LINKS.myjioIos + '" target="_blank" rel="noopener noreferrer">iOS</a> · <a href="' + LINKS.myjioAndroid + '" target="_blank" rel="noopener noreferrer">Android</a></li>';
    html += '</ul></footer>';

    pathRoot.innerHTML = html;

    document.getElementById('change-email-btn').addEventListener('click', function () {
      route = { view: 'jio-chooser', email: route.email };
      writeRoute(route, false);
      updateView();
    });
  }

  function mountCompare() {
    if (compareMounted) return;

    var tableHtml = '<div class="compare-table-wrap"><table class="compare-table">';
    tableHtml += '<caption>Simple AI Usage Comparison</caption>';
    tableHtml += '<thead><tr><th scope="col">AI Tool</th><th scope="col">Regular Price</th><th scope="col">AI File Capacity</th><th scope="col">Chat Endurance</th></tr></thead><tbody>';
    for (var i = 0; i < COMPARE_ROWS.length; i++) {
      var row = COMPARE_ROWS[i];
      tableHtml += '<tr><td>' + esc(row.tool) + '</td>';
      tableHtml += '<td>' + formatCell(row.price) + '</td>';
      tableHtml += '<td>' + formatCell(row.files) + '</td>';
      tableHtml += '<td>' + formatCell(row.chat) + '</td></tr>';
    }
    tableHtml += '</tbody></table></div>';

    var cardsHtml = '<div class="compare-cards">';
    for (var j = 0; j < COMPARE_ROWS.length; j++) {
      var r = COMPARE_ROWS[j];
      cardsHtml += '<article class="compare-card"><h2>' + esc(r.tool) + '</h2>';
      cardsHtml += '<div class="compare-metric"><div class="compare-metric-label">Regular Price</div><div class="compare-metric-value">' + formatCell(r.price) + '</div></div>';
      cardsHtml += '<div class="compare-metric"><div class="compare-metric-label">AI File Capacity</div><div class="compare-metric-value">' + formatCell(r.files) + '</div></div>';
      cardsHtml += '<div class="compare-metric"><div class="compare-metric-label">Chat Endurance</div><div class="compare-metric-value">' + formatCell(r.chat) + '</div></div>';
      cardsHtml += '</article>';
    }
    cardsHtml += '</div>';

    compareRoot.innerHTML = tableHtml + cardsHtml + '<footer class="compare-footer"><p>' + COMPARE_FOOTER + '</p></footer>';
    compareMounted = true;
  }

  function updateView() {
    renderBack();

    var showEligibility = route.view === 'hub' || route.view === 'jio-chooser' || route.view === 'jio-path';
    if (showEligibility) renderEligibility();
    else clearEligibility();

    mainWrap.classList.toggle('wide', route.view === 'compare');

    for (var key in views) {
      if (!Object.prototype.hasOwnProperty.call(views, key)) continue;
      views[key].hidden = route.view !== key;
    }

    if (route.view === 'hub') {
      mountHub();
    } else if (route.view === 'jio-chooser') {
      syncJioChooser();
    } else if (route.view === 'jio-path') {
      renderPath();
    } else if (route.view === 'compare') {
      mountCompare();
    }
  }

  function boot() {
    if (!applyHistoryState(history.state)) {
      route = parseRouteFromHash();
    }
    writeRoute(route, false);
    updateView();
  }

  window.addEventListener('hashchange', function () {
    if (applyHistoryState(history.state)) {
      updateView();
      return;
    }
    route = parseRouteFromHash();
    writeRoute(route, false);
    updateView();
  });

  window.addEventListener('popstate', function (event) {
    if (applyHistoryState(event.state)) {
      updateView();
      return;
    }
    route = parseRouteFromHash();
    updateView();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
